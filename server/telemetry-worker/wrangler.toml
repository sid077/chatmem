name = "chatmem-ingest"
main = "src/index.ts"
compatibility_date = "2026-07-23"

# One-shot setup:
#   npx wrangler d1 create chatmem-telemetry
#   # copy the printed database_id below
#   npx wrangler d1 execute chatmem-telemetry --remote --file=schema.sql
#   npx wrangler deploy
#
# The deploy URL becomes CHATMEM_TELEMETRY_URL for the chatmem client.
[[d1_databases]]
binding = "DB"
database_name = "chatmem-telemetry"
database_id = "5b08c292-04be-4066-88e4-77811b3fdc04"

# Keep observability on for a tiny public ingest. CPU limits are
# a paid-plan feature; the free tier's default 10ms is enough for the insert.
[observability]
enabled = true
