version: 2

project_name: chatmem

before:
  hooks:
    - go mod tidy

builds:
  - id: chatmem
    main: ./cmd/chatmem
    binary: chatmem
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    # Currently shipped: darwin/arm64, linux/amd64, linux/arm64.
    # darwin/amd64 needs a pgvector.dylib built for Intel Macs; ignored below.
    # windows/amd64 needs a pgvector.dll; add when someone volunteers to build one.
    ignore:
      - goos: darwin
        goarch: amd64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

# Linux packages: consumed by zypper (via a self-hosted repo — see
# scripts/build-rpm-repo.sh) and apt/dnf if you want to layer those on later.
nfpms:
  - id: chatmem
    package_name: chatmem
    file_name_template: "{{ .ConventionalFileName }}"
    homepage: https://github.com/siddhantdubey/chatmem
    description: |
      Local LLM chat history, served over MCP.
      Captures conversations from any MCP-compatible LLM client
      (Claude Code, Cursor, aider) into an embedded Postgres +
      pgvector database on your own machine.
    maintainer: Siddhant Dubey <siddhant.d777@gmail.com>
    license: Apache-2.0
    vendor: chatmem
    section: utils
    formats:
      - rpm
      - deb
    bindir: /usr/bin
    # Runtime glibc floor matches the pgvector.so we embed
    # (built against Debian 11 / glibc 2.31 via pgdg11+1).
    overrides:
      rpm:
        dependencies:
          - "glibc >= 2.31"
      deb:
        dependencies:
          - "libc6 (>= 2.31)"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Publish to the personal Homebrew tap as a cask (own tap, not homebrew-core —
# the bundled Postgres + pgvector assets push the tarball over the size ceiling
# that core enforces). Casks are the current preferred way to ship prebuilt
# binaries via Homebrew (`brews:` was deprecated in v2.10).
homebrew_casks:
  - name: chatmem
    repository:
      owner: siddhantdubey
      name: homebrew-chatmem
    homepage: "https://github.com/siddhantdubey/chatmem"
    description: "Local LLM chat history, served over MCP"
    license: "Apache-2.0"
    binaries: [chatmem]
