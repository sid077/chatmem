version: 2

project_name: chatmem

before:
  hooks:
    - go mod tidy

builds:
  - id: chatmem
    main: ./cmd/chatmem
    binary: chatmem
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    # Currently shipped: darwin/arm64, linux/amd64, linux/arm64.
    # darwin/amd64 needs a pgvector.dylib built for Intel Macs; ignored below.
    # windows/amd64 needs a pgvector.dll; add when someone volunteers to build one.
    ignore:
      - goos: darwin
        goarch: amd64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Publish to the personal Homebrew tap (own tap, not homebrew-core — the
# bundled Postgres + pgvector assets push the tarball over the size ceiling
# that core enforces).
brews:
  - name: chatmem
    repository:
      owner: siddhantdubey
      name: homebrew-chatmem
    homepage: "https://github.com/siddhantdubey/chatmem"
    description: "Local LLM chat history, served over MCP"
    license: "Apache-2.0"
    install: |
      bin.install "chatmem"
    test: |
      system "#{bin}/chatmem", "--version"
