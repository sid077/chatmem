<h1>chatmem — RPM repo</h1>
<p>Install on openSUSE / SLES / Fedora / RHEL:
<pre>sudo zypper ar https://sid077.github.io/chatmem/chatmem.repo   # openSUSE
sudo dnf config-manager --add-repo https://sid077.github.io/chatmem/chatmem.repo  # Fedora/RHEL
sudo zypper in chatmem</pre>
<p>See <a href="https://github.com/sid077/chatmem">the source repo</a> for docs.
